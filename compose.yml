x-backend: &backend
  profiles: ["app"]
  env_file: apps/backend/.env

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:${REDIS_PORT}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - 127.0.0.1:${RABBITMQ_PORT}:5672
      - 127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - 127.0.0.1:${RUSTFS_PORT}:9000
      - 127.0.0.1:${RUSTFS_CONSOLE_PORT}:9001
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rustfs-init:
    image: amazon/aws-cli:2.38.1
    restart: "no"
    profiles: ["init"]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET_NAME: ${BUCKET_NAME:-matcha}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$BUCKET_NAME" 2>/dev/null \
          || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$BUCKET_NAME"

  migrate:
    <<: *backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    command: ["./matcha", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    command: ["./matcha", "api"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:${BACKEND_PORT}:3333
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    command: ["./matcha", "worker"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  rustfs-data:
